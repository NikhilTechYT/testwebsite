<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A simple hello world page." />
    <title>Hello World</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
        font-family: "Inter", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #0d111c;
        color: #f5f7ff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 2rem;
        background:
          radial-gradient(circle at 50% 20%, rgba(88, 101, 242, 0.2), transparent 35rem),
          #0d111c;
      }

      main {
        width: min(100%, 48rem);
        padding: clamp(3rem, 10vw, 7rem) 2rem;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 1.5rem;
        background: rgba(21, 27, 43, 0.72);
        box-shadow: 0 2rem 5rem rgba(0, 0, 0, 0.28);
        text-align: center;
        backdrop-filter: blur(1rem);
      }

      h1 {
        margin: 0;
        font-size: clamp(3rem, 10vw, 6rem);
        line-height: 1;
        letter-spacing: -0.07em;
        background: linear-gradient(120deg, #ffffff 20%, #a8b4ff);
        background-clip: text;
        -webkit-background-clip: text;
        color: transparent;
      }

      p {
        margin: 1.5rem 0 0;
        color: #aeb7ce;
        font-size: 1rem;
        letter-spacing: 0.02em;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Hello World</h1>
      <p>A small beginning with a polished finish.</p>
    </main>
  </body>
</html>
